version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: mini_mlflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mini_mlflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mini_mlflow:password@db:5432/mini_mlflow
      - API_KEYS=dev_key_123
    depends_on:
      - db
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
